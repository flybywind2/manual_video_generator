[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internal-system-manual-video-agent"
version = "0.1.0"
requires-python = "==3.13.14"
dependencies = [
  "fastapi",
  "pillow",
  "playwright",
  "pydantic",
  "supertonic==1.3.1",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
]

[tool.setuptools.packages.find]
include = ["backend", "backend.*"]
exclude = ["backend.tests", "backend.tests.*"]
